name: "Setup Node + pnpm + Install Dependencies"
description: "Setup Node.js and install project dependencies with pnpm."
runs:
  using: "composite"
  steps:
    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.2.2

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        cache: pnpm

    - name: 📦 Install Project Dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
