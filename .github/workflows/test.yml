name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + pnpm + Install Dependencies
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🧪 Run Jest
        run: pnpm test --runInBand
