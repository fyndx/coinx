name: Web Export Validation

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + pnpm + Install Dependencies
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Export Web
        run: pnpm run export:web
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: web-export-validation
          EXPO_PUBLIC_BACKEND_URL: https://example.com
          EXPO_PUBLIC_SENTRY_DSN: https://public@example.com/1
