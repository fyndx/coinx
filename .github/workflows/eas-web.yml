name: EAS Web Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  deploy-web:
    name: Deploy Web to EAS
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'development' || (github.event_name == 'push' && 'production' || inputs.environment) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + pnpm + Install Dependencies
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "name=development" >> $GITHUB_OUTPUT
            echo "is_prod=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "name=production" >> $GITHUB_OUTPUT
            echo "is_prod=true" >> $GITHUB_OUTPUT
          else
            echo "name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            if [[ "${{ inputs.environment }}" == "production" ]]; then
              echo "is_prod=true" >> $GITHUB_OUTPUT
            else
              echo "is_prod=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set environment variables
        run: |
          ENV_NAME="${{ steps.env.outputs.name }}"
          echo "EXPO_PUBLIC_APP_ENV=$ENV_NAME" >> .env
          echo "EXPO_PUBLIC_APP_ENV=$ENV_NAME" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_BACKEND_URL=${{ secrets.EXPO_PUBLIC_BACKEND_URL }}" >> .env
          echo "EXPO_PUBLIC_BACKEND_URL=${{ secrets.EXPO_PUBLIC_BACKEND_URL }}" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" >> .env
          echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" >> $GITHUB_ENV
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> .env
          echo "SENTRY_ORG=${{ secrets.SENTRY_ORG }}" >> $GITHUB_ENV
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> .env
          echo "SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}" >> $GITHUB_ENV

      - name: Export Web
        run: npx expo export -p web

      - name: Deploy to EAS Web Hosting
        run: |
          if [[ "${{ steps.env.outputs.is_prod }}" == "true" ]]; then
            eas deploy --prod --non-interactive
          else
            eas deploy --non-interactive
          fi
